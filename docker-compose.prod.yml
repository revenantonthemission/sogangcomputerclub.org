services:
  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - backend_sgcc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    restart: unless-stopped
    networks:
      - backend_sgcc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Prod exposes Redis port? It was in original prod.yml
    networks:
      - backend_sgcc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    extends:
      file: docker-compose.base.yml
      service: zookeeper
    restart: unless-stopped
    networks:
      - backend_sgcc-network

  kafka:
    extends:
      file: docker-compose.base.yml
      service: kafka
    restart: unless-stopped
    networks:
      - backend_sgcc-network

  redis-exporter:
    extends:
      file: docker-compose.base.yml
      service: redis-exporter
    restart: unless-stopped
    networks:
      - backend_sgcc-network

  postgres-exporter:
    extends:
      file: docker-compose.base.yml
      service: postgres-exporter
    restart: unless-stopped
    networks:
      - backend_sgcc-network

  nginx-exporter:
    extends:
      file: docker-compose.base.yml
      service: nginx-exporter
    restart: unless-stopped
    networks:
      - backend_sgcc-network

  prometheus:
    extends:
      file: docker-compose.base.yml
      service: prometheus
    restart: unless-stopped
    networks:
      - backend_sgcc-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    extends:
      file: docker-compose.base.yml
      service: grafana
    restart: unless-stopped
    networks:
      - backend_sgcc-network
    environment:
      # Need to redefine specific env vars if base defaults are not enough?
      # Base: GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD, GF_USERS_ALLOW_SIGN_UP
      # Prod adds: GF_SERVER_ROOT_URL
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend is NOT in base, so we define fully here
  frontend:
    build: ./frontend
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend
    networks:
      - backend_sgcc-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx config differs significantly in prod (certs)
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-sogangcomputerclub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/html
    networks:
      - backend_sgcc-network
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/html
      - ./certs:/output/certs
      - ./letsencrypt:/etc/letsencrypt
      - ./scripts/manage-certs.sh:/usr/local/bin/manage-certs.sh
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do /usr/local/bin/manage-certs.sh; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:
  certbot_www:

networks:
  backend_sgcc-network:
    external: true
