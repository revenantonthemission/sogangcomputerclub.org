name: Frontend CI

on:
  push:
    branches: [main, master, "feature/frontend-*", "feature/CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: "20.x"

      - name: Run type checking
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7
