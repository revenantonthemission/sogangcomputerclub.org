name: Backend CI

on:
  push:
    branches: [main, master, "feature/backend-*", "feature/CI-CD"]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --ignore=tests/integration --ignore=tests/load

      - name: Generate coverage report
        run: |
          uv run pytest tests/ --cov=app --cov-report=xml --cov-report=html --ignore=tests/integration --ignore=tests/load
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: success()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Check code formatting with ruff
        run: |
          uv run ruff check app/ tests/ || echo "Ruff not installed, skipping"
        continue-on-error: true
