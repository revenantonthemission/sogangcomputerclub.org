services:
  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    networks:
      - app-network

  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    ports:
      - "5433:5432"
    networks:
      - app-network

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    ports:
      - "6381:6379"
    networks:
      - app-network

  zookeeper:
    extends:
      file: docker-compose.base.yml
      service: zookeeper
    networks:
      - app-network

  kafka:
    extends:
      file: docker-compose.base.yml
      service: kafka
    environment:
      # Specific override if needed, otherwise base is fine.
      # Base has advertised listener as localhost:9092 which is correct for dev
      KAFKA_BROKER_ID: 1
    networks:
      - app-network

  redis-exporter:
    extends:
      file: docker-compose.base.yml
      service: redis-exporter
    networks:
      - app-network

  postgres-exporter:
    extends:
      file: docker-compose.base.yml
      service: postgres-exporter
    networks:
      - app-network

  nginx-exporter:
    extends:
      file: docker-compose.base.yml
      service: nginx-exporter
    networks:
      - app-network

  prometheus:
    extends:
      file: docker-compose.base.yml
      service: prometheus
    networks:
      - app-network

  grafana:
    extends:
      file: docker-compose.base.yml
      service: grafana
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - HOST=${HOST}
      - PORT=${PORT}
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-sogangcomputerclub.conf:/etc/nginx/conf.d/sogangcomputerclub.conf:ro
      - ./nginx:/etc/nginx/snippets:ro
      - ./nginx.sh:/nginx.sh
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "/nginx.sh"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./frontend/build:/var/www/html
      - ./certbot.sh:/certbot.sh
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command: -c "/certbot.sh"
    networks:
      - app-network
    depends_on:
      - nginx
    links:
      - nginx

volumes:
  # Volumes defined in base are NOT automatically imported unless using 'include'
  # Since we are using extends, we must redefine named volumes if we want them to be managed here
  # However, services in 'extends' refer to volumes in the BASE file?
  # No, "volumes" in service config refer to top-level volumes in the CURRENT file context usually.
  # Let's define them to be safe.
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  certbot_certs:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: docker1
